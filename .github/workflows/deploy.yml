name: CI/CD to VDS

on:
  push:
    branches: [main] # veya kullandığın ana dal adı (master vb.)

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy to Web Root
        run: |
          rm -rf /var/www/toolio/*
          cp -r dist/* /var/www/toolio/

# =============================================================================
#  Toolio icin ONERILEN Nginx ayari
# -----------------------------------------------------------------------------
#  Bu dosya sunucuya otomatik KOPYALANMAZ. Bir kez, elle uygulamaniz yeterli.
#  Ayrintili anlatim: README.md > "Nginx ayari (bir kerelik, onerilir)"
#
#  Ne saglar?
#   - /pdf-merge gibi adresler /pdf-merge/ adresine yonlenir ve build sirasinda
#     uretilen hazir HTML sunulur (Google sayfanin icerigini dogrudan gorur).
#   - Olmayan adresler gercek "404 Not Found" doner (soft 404 olmaz).
#   - JS/CSS dosyalari 1 yil, HTML dosyalari ise her seferinde yeniden
#     dogrulanarak onbelleklenir; yeni surum yayinlaninca hemen gorunur.
#
#  Uygulama:
#   1) Mevcut ayar dosyanizi yedekleyin, ornegin:
#        sudo cp /etc/nginx/sites-available/toolio /root/toolio.nginx.yedek
#   2) Asagidaki "server { ... }" bloklarini mevcut dosyanizdakilerle degistirin.
#      SSL sertifika satirlarinizi (certbot'un ekledigi ssl_certificate vb.)
#      AYNEN koruyun.
#   3) sudo nginx -t        (hata yoksa "syntax is ok" yazar)
#   4) sudo systemctl reload nginx
# =============================================================================

# HTTP -> HTTPS ve www -> www'suz yonlendirme
server {
    listen 80;
    listen [::]:80;
    server_name toolio.com.tr www.toolio.com.tr;
    return 301 https://toolio.com.tr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toolio.com.tr www.toolio.com.tr;

    # --- SSL: kendi satirlarinizi burada koruyun (certbot ornegi) ---
    ssl_certificate     /etc/letsencrypt/live/toolio.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolio.com.tr/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www ile gelenleri tek adrese topla
    if ($host = www.toolio.com.tr) {
        return 301 https://toolio.com.tr$request_uri;
    }

    root /var/www/toolio;
    index index.html;
    charset utf-8;

    # Yonlendirmelerde (ör. /about -> /about/) alan adini tekrar yazma
    absolute_redirect off;

    # Gizli dosyalari (.git vb.) asla sunma
    location ~ /\. {
        deny all;
    }

    # Hash'li JS/CSS dosyalari: uzun sure onbellek
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Gorseller ve ikonlar
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ads.txt, robots.txt, sitemap.xml: kisa onbellek
    location ~* ^/(ads\.txt|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Sayfalar: once dosya, sonra klasor (klasordeki index.html), yoksa 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Ozel 404 sayfasi (build sirasinda uretilir)
    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache";
        internal;
    }

    # Sikistirma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

}

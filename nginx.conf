server {
    listen 80;
    
    # Kök dizin
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma (Sitenin hızlı açılması için)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ANA SPA AYARI BURASI
    location / {
        # Önce dosyayı ($uri) bulmaya çalış, 
        # bulamazsan klasöre ($uri/) bak,
        # onu da bulamazsan index.html'i gönder.
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar (js, css, resim) için cache ayarı
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}

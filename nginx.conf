# Docker imaji icin Nginx ayari (Dockerfile bunu kullanir).
# Sunucuda dogrudan Nginx kullaniyorsaniz deploy/nginx-toolio.conf dosyasina bakin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache";
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
}
